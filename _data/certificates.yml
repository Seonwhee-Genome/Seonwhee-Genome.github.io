# Certificates shown on /Certificates/
#
# groups   -> top-level cards (Awards, AI/ML, Data Engineering, Infra/Ops)
# sections -> sub-categories inside a group (optional title)
# items    -> one collapsible card per certificate
#
# Item fields:
#   title, issuer         : shown on the collapsed card
#   badge                 : optional highlight label (e.g. an award)
#   link                  : certificate / verification URL
#   syllabus              : syllabus URL, syllabus_icon: paperclip (default) | download
#   instructor, instructor_link
#   tools                 : list of tool tags
#   body                  : Markdown / HTML details shown when expanded

groups:
  - id: awards
    title: Awards
    icon: fas fa-trophy
    unit: award
    sections:
      - items:
          - title: "2022 AI Online Contest: Smart Vehicle Speech Recognition Challenge"
            issuer: Korean Ministry of Science and ICT
            badge: "🥈 2nd of 32 teams"
            link: https://aichallenge.or.kr/competition/detail/1
            body: |
              The Korean Ministry of Science and ICT hosted the 2022 AI Online Contest to identify small- and medium-sized enterprises developing creative AI applications and to support them in their work. Only those who worked for such firms could enter the contest.

              There were 10 different categories in which entrants could compete: smart vehicle speech recognition, speaker recognition for security applications, machine reading comprehension, semantic segmentation of harbor structures, information retrieval systems for libraries, water pollution forecasting, water pipe leakage detection, raw beef quality grading, moving object detection, and satellite image in-painting.

              Those who finished in 1st through 4th place qualified to apply for a government subsidy of approximately KRW 200M for a new AI business. My team, `explicit-vehicle-asr`, came in 2nd out of 32 teams ([leaderboard](https://aichallenge.or.kr/competition/detail/1/task/7/leaderboard){:target="_blank"}) and received a certificate of excellence.

              <img src="/assets/img_cert/cert_of_excel.jpeg" alt="Award ceremony" width="450" />
              *I (third from right) was at the award ceremony*

              [How we approached the problem →](/portfolio/Vehicle_Automatic_Speech_Recognition/)

  - id: ai-ml
    title: AI / ML
    icon: fas fa-brain
    sections:
      - title: Natural Language Processing
        items:
          - title: Sentiment Analysis with Deep Learning using BERT
            issuer: Coursera
            link: https://coursera.org/share/d47c6b15fb23720f2226d330b8191661
            syllabus: https://www.coursera.org/learn/sentiment-analysis-bert/supplement/2KrW0/project-based-course-overview
            tools: [Python, PyTorch]
            body: |
              The hands on project on Sentiment Analysis with Deep Learning using BERT is divided into following tasks:

              * Task 1: An introduction to some basic theory behind BERT, and the problem we will be using it to solve
              * Task 2: Explore dataset distribution and some basic preprocessing
              * Task 3: Split dataset into training and validation using stratified approach
              * Task 4: Loading pretrained tokenizer to encode our text data into numerical values (tensors)
              * Task 5: Load in pretrained BERT with custom final layer
              * Task 6: Create dataloaders to facilitate batch processing
              * Task 7: Choose and optimizer and scheduler to control training of model
              * Task 8: Design performance metrics for our problem
              * Task 9: Create a training loop to control PyTorch finetuning of BERT using CPU or GPU acceleration
              * Task 10: Load in a pre-saved finetuned BERT model and evaluate its performance, and some final thoughts

          - title: Natural Language Processing Nanodegree
            issuer: Udacity
            link: https://graduation.udacity.com/confirm/LYZAKAJM
            syllabus: https://d20vrrgs8k4bvw.cloudfront.net/documents/en-US/NLP+Nanodegree+Syllabus.pdf
            syllabus_icon: download
            tools: [Python, Jupyter Notebook, Tensorflow]
            body: |
              * **PART 1 Introduction to Natural Language Processing**<br>
                Project: Building a part of speech tagger using hidden Markov models<br>
                Use table lookups, n-grams, and hidden Markov models to tag parts of speech in sentences and compare their performance
              * **PART 2 Computing with Natural Language**<br>
                Project: Machine Translation<br>
                Build a deep neural network that functions as part of an end-to-end machine translation pipeline
              * **PART 3 Communicating with Natural Language**<br>
                Project: DNN Speech Recognizer<br>
                Build a deep neural network that functions as part of an end-to-end automatic speech recognition (ASR) pipeline

          - title: Natural Language Processing Specialization
            issuer: Coursera
            link: https://www.coursera.org/account/accomplishments/specialization/WKMNNCZ79JGZ
            syllabus: https://www.coursera.org/specializations/natural-language-processing?#courses
            tools: [Python, Jupyter Notebook, Tensorflow, Trax]
            body: |
              * **Natural Language Processing with Classification and Vector Spaces** [<i class="fas fa-link"></i>](https://www.coursera.org/account/accomplishments/verify/GZHD7DSJRWZR){:target="_blank"}<br>
                Use logistic regression, naïve Bayes, and word vectors to implement sentiment analysis, complete analogies & translate words
              * **Natural Language Processing with Probabilistic Models** [<i class="fas fa-link"></i>](https://www.coursera.org/account/accomplishments/verify/DJC3PCYKQKLK){:target="_blank"}<br>
                Use dynamic programming, hidden Markov models, and word embeddings to implement autocorrect, autocomplete & identify part-of-speech tags for words
              * **Natural Language Processing with Sequence Models** [<i class="fas fa-link"></i>](https://www.coursera.org/account/accomplishments/verify/TMH5KJATXYHW){:target="_blank"}<br>
                Use recurrent neural networks, LSTMs, GRUs & Siamese network in TensorFlow & Trax for sentiment analysis, text generation & named entity recognition
              * **Natural Language Processing with Attention Models** [<i class="fas fa-link"></i>](https://www.coursera.org/account/accomplishments/verify/HBV9NY86GF7L){:target="_blank"}<br>
                Use encoder-decoder, causal, & self-attention to machine translate complete sentences, summarize text, build chatbots & question-answering

          - title: Deep Learning for Natural Language Processing (in Korean)
            issuer: Seoul National University Big Data Academy
            link: https://drive.google.com/file/d/1gywzWF6bu6qvIxwiP7fpaArhIALq22E3/view?usp=sharing
            syllabus: https://hpshin.github.io/NaturalLanguageBigDataAnalysis/index.html
            instructor: Professor Hyopil Shin
            instructor_link: http://knlp.snu.ac.kr/#p3
            tools: [Python, Jupyter Notebook, PyTorch, Huggingface]
            body: |
              - Attention Model
              - Transformer
              - BERT (Bidirectional Encoder Representations from Transformers)

          - title: Introduction to Linguistics
            issuer: Udemy
            link: https://www.udemy.com/certificate/UC-8TBMBQBQ/
            syllabus: https://www.udemy.com/course/introduction-to-linguistics/
            body: |
              - Understand the fundamentals of language
              - Understand sentence structure and word order of various languages.
              - Classify words into nouns, verbs, adjectives, prepositions, quantifiers, and adverbs.
              - Draw syntactic trees for simple sentences.
              - Understand the difference between entailment, implicature, presupposition, and contradiction.
              - Identify the thematic role of words in a sentence.
              - Understand what affixes do and how they can change the meaning of words.
              - Identify morphological processes in languages across the world.
              - Understand the properties of vowels and consonants.
              - Read and write the International Phonetic Alphabet.
              - Understand how sounds interact with each other.
              - Use the features of sounds to create rules about how sounds change in different environments.
              - Attain the toolbox required to learn languages a little bit easier.

